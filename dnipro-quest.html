<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{
  --sun:#f7b733; --sunflower:#f39c12; --leaf:#3e8e41; --river:#1e88b5;
  --petal:#e0507a; --cream:#fff8ec; --ink:#3a2c1c; --card:#ffffff;
  --border:#f0d9a8; --accent:#c0392b;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;font-family:'Segoe UI',Verdana,sans-serif;background:linear-gradient(180deg,var(--cream),#fdf1da 40%,#fff);color:var(--ink);}
header{position:sticky;top:0;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(120deg,var(--sunflower),var(--sun));padding:10px 8px calc(10px + env(safe-area-inset-top,0px));box-shadow:0 3px 10px rgba(0,0,0,.15)}
.title-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;max-width:1100px;margin:0 auto}
.title-row h1{margin:0;font-size:1.15rem;color:#4a2c00}
.progress-wrap{flex:1;min-width:160px;max-width:280px;background:rgba(255,255,255,.5);border-radius:20px;height:14px;overflow:hidden;border:1px solid #fff}
.progress-bar{height:100%;background:var(--leaf);width:0%;transition:width .4s}
nav{display:flex;flex-wrap:wrap;gap:4px;max-width:1100px;margin:8px auto 0;justify-content:center}
nav button{border:none;background:rgba(255,255,255,.6);padding:6px 10px;border-radius:14px;font-size:.8rem;cursor:pointer;font-weight:600;color:#5a3400}
nav button.active{background:var(--card);box-shadow:0 2px 4px rgba(0,0,0,.2)}
nav button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ccc;margin-right:4px}
nav button.done .dot{background:var(--leaf)}
main{max-width:900px;margin:0 auto;padding:16px 12px 60px}
section{display:none;animation:fade .3s}
section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
h2{color:var(--accent);border-bottom:3px solid var(--sun);display:inline-block;padding-bottom:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.card h3{margin:0 0 6px;font-size:1rem;color:#7a4a00}
.hero{text-align:center;padding:24px 10px}
.hero .emojis{font-size:2.4rem;margin:10px 0}
.big-btn{background:var(--accent);color:#fff;border:none;padding:14px 26px;border-radius:30px;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #8e2a1f}
.big-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8e2a1f}
.passport{background:#fff3d6;border:2px dashed #d9a441;border-radius:14px;padding:14px;margin-top:18px}
.passport h3{margin-top:0;color:#7a4a00}
.passport label{display:block;font-size:.82rem;margin:8px 0 3px;font-weight:600}
.passport input,.passport textarea{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:.85rem}
.save-msg{font-size:.8rem;color:var(--leaf);font-weight:700;height:1em;margin-top:6px}
.quiz-q{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.opt{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:#fffdf7;cursor:pointer}
.opt.correct{background:#d8f3d0;border-color:var(--leaf)}
.opt.wrong{background:#fbd7d7;border-color:var(--accent)}
.flip{cursor:pointer;background:linear-gradient(135deg,#fff,#fff3d6)}
.flip .ans{display:none;margin-top:6px;font-size:.85rem}
.flip.open .ans{display:block}
.tag{display:inline-block;background:var(--leaf);color:#fff;font-size:.7rem;padding:2px 8px;border-radius:10px;margin-bottom:6px}
select{padding:6px;border-radius:8px;border:1px solid var(--border)}
.builder-preview{font-size:2.4rem;text-align:center;margin:10px 0;min-height:50px}
.mapbox{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mapbox button{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer}
.mapbox button.picked{background:var(--leaf);color:#fff}
.feedback{font-weight:700;margin-top:8px}
.checklist label{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin:6px 0}
.result-box{text-align:center;padding:20px;font-size:1.2rem;font-weight:700}
.sources{font-size:.75rem;color:#7a6a55;margin-top:30px;border-top:1px solid var(--border);padding-top:10px}

const SECTIONS = [
 {id:'home', label:'🏠 Головна'},
 {id:'geo', label:'🗺️ Географія'},
 {id:'nature', label:'🌿 Природа'},
 {id:'cities', label:'🏙️ Міста'},
 {id:'history', label:'📜 Історія'},
 {id:'petrykivka', label:'🌺 Петриківка'},
 {id:'culture', label:'🎨 Культура'},
 {id:'dnipro', label:'🌊 Дніпро'},
 {id:'post', label:'📮 Пошта'},
 {id:'facts', label:'⭐ Цікавинки'},
 {id:'passport', label:'📖 Паспорт'},
 {id:'quest', label:'🏆 Квест'},
];

function nav(){
  const n=document.getElementById('nav');
  n.innerHTML=SECTIONS.map(s=>`<button data-id="${s.id}" onclick="show('${s.id}')"><span class="dot"></span>${s.label}</button>`).join('');
}
function markDone(id){
  let d=JSON.parse(localStorage.getItem('dp_done')||'{}'); d[id]=true;
  localStorage.setItem('dp_done',JSON.stringify(d)); updateProgress();
}
function updateProgress(){
  let d=JSON.parse(localStorage.getItem('dp_done')||'{}');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('done', !!d[b.dataset.id]));
  const pct=Math.round(100*Object.keys(d).length/SECTIONS.length);
  document.getElementById('progressBar').style.width=pct+'%';
}
function show(id){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  document.querySelectorAll('main section').forEach(s=>s.classList.toggle('active',s.id===id));
  if(id!=='home') markDone(id);
  window.scrollTo({top:0,behavior:'smooth'});
}
function saveField(key,val,msgId){
  let p=JSON.parse(localStorage.getItem('dp_passport')||'{}'); p[key]=val;
  localStorage.setItem('dp_passport',JSON.stringify(p));
  const m=document.getElementById(msgId); if(m){m.textContent='Збережено ✓'; setTimeout(()=>m.textContent='',1200);}
}
function loadField(key){ let p=JSON.parse(localStorage.getItem('dp_passport')||'{}'); return p[key]||''; }

function passportBlock(title, fields, prefix){
  return `<div class="passport"><h3>📝 Запиши у свій Паспорт: ${title}</h3>
  ${fields.map((f,i)=>{
    const key=prefix+'_'+i;
    const val=loadField(key).replace(/"/g,'&quot;');
    return `<label>${f}</label><input value="${val}" oninput="saveField('${key}',this.value,'${prefix}msg')">`;
  }).join('')}
  <div class="save-msg" id="${prefix}msg"></div></div>`;
}

  const nextIdx = routeBuilt.length;
  if(step===ROUTE[nextIdx]){
    routeBuilt.push(step); btn.disabled=true; btn.classList.add('correct');
    document.getElementById('postFeedback').textContent = routeBuilt.join(' → ');
    if(routeBuilt.length===ROUTE.length) document.getElementById('postFeedback').textContent += '  🎉 Лист доставлено!';

}

let qIdx=0, qScore=0;
function quizRender(){
  if(qIdx>=QUIZ.length){ quizFinish(); return; }
  const item=QUIZ[qIdx];
  document.getElementById('quizArea').innerHTML = `<div class="quiz-q"><p><b>Питання ${qIdx+1} з ${QUIZ.length}:</b> ${item.q}</p>
   ${item.o.map((o,i)=>`<button class="opt" onclick="quizAnswer(${i})">${o}</button>`).join('')}</div>`;
  document.getElementById('quizResult').textContent='';
}
function quizAnswer(i){
  const item=QUIZ[qIdx];
  const btns=[...document.querySelectorAll('#quizArea .opt')];
  btns.forEach((b,idx)=>{ if(idx===item.a) b.classList.add('correct'); else if(idx===i) b.classList.add('wrong'); b.disabled=true;});
  if(i===item.a) qScore++;
  setTimeout(()=>{ qIdx++; quizRender(); },800);
}
function quizFinish(){
  document.getElementById('quizArea').innerHTML='';
  let msg='🌱 Ти дослідник-початківець!';
  if(qScore>=13) msg='🏆 Ти справжній знавець краю!';
  else if(qScore>=8) msg='🌻 Ти чудово знаєш Дніпропетровщину!';
  document.getElementById('quizResult').innerHTML = `Правильних відповідей: ${qScore} з ${QUIZ.length}<br>${msg}
   <br><button class="big-btn" style="margin-top:10px" onclick="qIdx=0;qScore=0;quizRender()">Спробувати ще раз</button>`;
  markDone('quest');
}
